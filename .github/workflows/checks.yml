name: Checks

# Every check, shared by ci.yml (pull requests and branches) and deploy.yml (main), so the two
# can't drift apart. With `site`, the built site is also kept (as the artifact "site") for
# deploy.yml to publish.
on:
  workflow_call:
    inputs:
      site:
        description: Keep the built site for deploy.yml
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Downloads each language's interpreter, pinned in languages/<id>/runtime.lock.json. Fails if
      # it doesn't match the checksum published with the release, or the checksums in the lock.
      - run: npm run fetch-runtime
      # Every blank must fail while unfilled and every solution must pass, on the same engine as the browser.
      - run: npm run check:koans
      # The result panel's reading of real runs, and answer hints for every koan.
      - run: npm test
      - run: npm run build:koans && npm run check
      - run: npm run build
      # The built site in Chrome and Firefox (both come with GitHub's Ubuntu runners).
      - run: node tests/browser/run.mjs
      - if: inputs.site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 7
