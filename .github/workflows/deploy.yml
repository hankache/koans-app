name: Deploy to GitHub Pages

# Publishes the site on every push to main, but only if every check passes: a broken koan
# or a build failure leaves the live site as it was. Can also be run by hand from the
# Actions tab. Needs Settings → Pages → Source set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Every check (checks.yml), then the built site uploaded for Pages.
  build:
    uses: ./.github/workflows/checks.yml
    with:
      pages: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
