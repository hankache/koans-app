<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn a programming language by fixing small failing tests, right in your browser." />
    <title>koans.app</title>
    <script>
      // Choose the theme before anything is drawn, so the page never flashes the wrong one:
      // the visitor's saved choice, or else dark, the site's own look.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('koans:theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : true;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        // The built pages' plain HTML is for search engines and link previews: with scripts on,
        // the app takes its place (src/main.ts), so it stays hidden rather than flash by.
        document.documentElement.classList.add('js');
      })();
    </script>
    <!-- PNG first, SVG last: Firefox takes the last icon, and the SVG adapts to dark tabs.
         sizes="32x32" keeps Chrome choosing the SVG too. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
